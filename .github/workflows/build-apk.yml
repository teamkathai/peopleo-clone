name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Flutter create (platform scaffolding)
        run: flutter create --org com.oasystspl --project-name peopleo_clone --platforms android .

      - name: Inject Android permissions
        run: |
          python3 - <<'PY'
          import re, io
          p = "android/app/src/main/AndroidManifest.xml"
          s = open(p, encoding="utf-8").read()
          perms = [
              "android.permission.INTERNET",
              "android.permission.CAMERA",
              "android.permission.ACCESS_FINE_LOCATION",
              "android.permission.ACCESS_COARSE_LOCATION",
              "android.permission.USE_BIOMETRIC",
              "android.permission.POST_NOTIFICATIONS",
              "android.permission.ACCESS_NETWORK_STATE",
              "android.permission.WAKE_LOCK",
          ]
          lines = "".join(f'    <uses-permission android:name="{x}"/>\n' for x in perms)
          # insert right after the opening <manifest ...> tag
          s = re.sub(r"(<manifest[^>]*>\n)", r"\1" + lines, s, count=1)
          open(p, "w", encoding="utf-8").write(s)
          print(s[:600])
          PY

      - name: Relax Kotlin JVM-target validation
        run: |
          echo "kotlin.jvm.target.validation.mode=warning" >> android/gradle.properties

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Build slim release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peopleo-clone-apk
          path: build/app/outputs/flutter-apk/app-debug.apk

      - name: Upload slim APKs
        uses: actions/upload-artifact@v4
        with:
          name: peopleo-clone-split-apks
          path: build/app/outputs/flutter-apk/app-*-release.apk
