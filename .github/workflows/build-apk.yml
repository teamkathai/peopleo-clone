name: Build APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Generate android/ios platform folders around the source in this repo.
      - name: Flutter create (platform scaffolding)
        run: flutter create --org com.oasystspl --project-name peopleo_clone .

      - name: Pub get
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: peopleo-clone-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
