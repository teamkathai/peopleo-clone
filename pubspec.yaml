name: peopleo_clone
description: Rebuilt employee attendance app (SSEPD) wired to the live backend, with open-source on-device face match.
publish_to: "none"
version: 3.0.3+33

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.7.0
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  camera: ^0.11.0+2
  google_mlkit_face_detection: ^0.12.0
  tflite_flutter: ^0.12.1
  image: ^4.3.0
  image_picker: ^1.1.2
  geolocator: ^13.0.1
  intl: ^0.19.0
  permission_handler: ^11.3.1
  path_provider: ^2.1.4

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/
